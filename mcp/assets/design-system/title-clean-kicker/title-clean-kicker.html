<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>title-clean-kicker</title>

    <!-- ========================================================================
         video-vob design-system REFERENCE component — title-clean-kicker
         An editorial full-frame title for long-form / tutorial / general.

         A small UPPERCASE tracked kicker sits just above a large clean headline,
         left-aligned with a generous margin inside the 16:9 safe area. Calm and
         confident, lots of whitespace. The kicker fades+slides in first; the
         headline rises in 0.12s later. A thin accent underline grows under it.

         Render contract (shared by every design-system component):
         1. PURE CSS @keyframes — never GSAP. window.__timelines is a no-op stub.
         2. STAGGER WITH data-start, NEVER animation-delay (the runtime hijacks
            animation-delay to scrub a paused animation to each frame).
         3. COLORS via --vob-* tokens with a literal fallback.
         4. FONTS = a concrete auto-resolved kit family, NO var() in font-family,
            NO font <link>/@import. The composer swaps the family for
            target.design.typography.{headline|body|caption}.
         5. Every timed element: class="clip" + id + data-start + data-duration +
            data-track-index (>=1, distinct per overlapping element);
            animation-duration == data-duration; fill-mode both; play-state paused.
         ===================================================================== -->

    <style>
      :root {
        --vob-bg: #0c0d10;
        --vob-surface: #14141a;
        --vob-text: #f4f5f7;
        --vob-text-muted: #b8b8c0;
        --vob-accent: #ff3b30;
        --vob-accent-2: #ffd60a;
        --vob-safe-top: 96px;
        --vob-safe-bottom: 96px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--vob-bg, #0c0d10);
      }
      /* Demo backdrop — stands in for the video spine; dropped in the real comp. */
      .ds-demo-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(105deg, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.12) 52%, rgba(0, 0, 0, 0) 100%),
          radial-gradient(135% 120% at 16% 30%, #23252e 0%, #131419 56%, #08090c 100%);
      }
      .ds-block {
        position: absolute;
        left: 140px;
        top: 50%;
        z-index: 2;
        transform: translateY(-50%);
        max-width: 1180px;
      }
      .ds-kicker {
        font-family: "Inter", "Helvetica Neue", sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        font-size: 34px;
        line-height: 1;
        color: var(--vob-accent, #ff3b30);
        margin: 0 0 30px 4px;
        transform-origin: 0% 50%;
        animation-name: vob-kicker-in;
        animation-duration: 4s;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-play-state: paused;
        will-change: transform, opacity;
      }
      .ds-headline {
        font-family: "Outfit", "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 120px;
        line-height: 0.98;
        letter-spacing: -0.018em;
        color: var(--vob-text, #f4f5f7);
        margin: 0;
        text-shadow: 0 14px 48px rgba(0, 0, 0, 0.45);
        animation-name: vob-headline-in;
        animation-duration: 3.88s;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-play-state: paused;
        will-change: transform, opacity;
      }
      .ds-underline {
        position: absolute;
        left: 144px;
        top: calc(50% + 196px);
        z-index: 2;
        width: 168px;
        height: 5px;
        background: var(--vob-accent, #ff3b30);
        transform-origin: 0% 50%;
        animation-name: vob-underline-in;
        animation-duration: 3.8s;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-play-state: paused;
      }
      @keyframes vob-kicker-in {
        0% {
          opacity: 0;
          transform: translateX(-44px);
          animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        13% {
          opacity: 1;
          transform: translateX(0);
        }
        90% {
          opacity: 1;
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.4, 0, 0.7, 0.2);
        }
        100% {
          opacity: 0;
          transform: translateX(0);
        }
      }
      @keyframes vob-headline-in {
        0% {
          opacity: 0;
          transform: translateY(46px);
          animation-timing-function: cubic-bezier(0.16, 0.8, 0.28, 1);
        }
        14% {
          opacity: 1;
          transform: translateY(0);
        }
        90% {
          opacity: 1;
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0.4, 0, 0.7, 0.2);
        }
        100% {
          opacity: 0;
          transform: translateY(-18px);
        }
      }
      @keyframes vob-underline-in {
        0% {
          transform: scaleX(0);
          opacity: 0;
        }
        16% {
          transform: scaleX(0);
          opacity: 0;
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        }
        30% {
          transform: scaleX(1);
          opacity: 1;
        }
        90% {
          transform: scaleX(1);
          opacity: 1;
        }
        100% {
          transform: scaleX(1);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="ds-title-clean-kicker"
      data-timeline-locked
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div class="ds-demo-bg"></div>
      <div class="ds-block">
        <p id="ds-kicker" class="clip ds-kicker" data-start="0" data-duration="4" data-track-index="1">The Complete Guide</p>
        <h1 id="ds-headline" class="clip ds-headline" data-start="0.12" data-duration="3.88" data-track-index="2">Designing systems that<br />actually scale</h1>
      </div>
      <div id="ds-underline" class="clip ds-underline" data-start="0.2" data-duration="3.8" data-track-index="3"></div>
    </div>

    <script>
      /* Inert timeline stub — the render driver calls duration()/pause()
         unconditionally; a pure-CSS component loads no GSAP. */
      window.__timelines = window.__timelines || {};
      window.__timelines["ds-title-clean-kicker"] = {
        duration: function () {
          return 4;
        },
        pause: function () {},
      };
    </script>
  </body>
</html>

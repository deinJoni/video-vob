<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>backdrop-film-bars</title>

    <!-- ========================================================================
         video-vob design-system REFERENCE BACKDROP — backdrop-film-bars
         Landscape (1920×1080). Cinemascope letterbox: solid black bars top &
         bottom (~12% each) framing a central scene area, a soft vignette and a
         faint film grain in the center, with a barely-perceptible grain shimmer.
         Cinematic framing.

         HOW THE COMPOSER USES A BACKDROP:
           Full-frame background on the LOWEST track. The center band frames the
           real foreground (subject/title/clip) which rides on tracks above; the
           bars + vignette + grain sit behind/around it for a cinema feel.

         Render contract (shared by every design-system component):
         1. PURE CSS @keyframes — never GSAP. window.__timelines is a no-op stub.
         2. STAGGER WITH data-start, NEVER animation-delay. The grain shimmer is
            one class="clip" element; animation-duration == data-duration;
            data-start=0; distinct data-track-index per overlapping timed clip.
         3. COLORS via --vob-* tokens with a literal fallback; the composer
            re-skins from target.design.
         4. Static layers (bars, vignette) need no data-start. Any label uses a
            concrete auto-resolved family (Inter) + generic fallback — no var() in
            font-family, no font <link>.
         ===================================================================== -->

    <style>
      :root {
        --vob-bg: #000000;
        --vob-surface: #14141a;
        --vob-accent: #ff3b30;
        --vob-text: #ffffff;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--vob-bg, #000000);
      }
      /* Center scene band — a rich, faintly graded field (warm key + cool fill +
         floor shade) so the framed area has tonal range, never a flat fill. The
         real foreground rides over this. */
      .ds-scene {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(50% 70% at 42% 46%, rgba(60, 58, 70, 0.7) 0%, rgba(22, 22, 30, 0.3) 48%, rgba(10, 10, 14, 0) 72%),
          radial-gradient(40% 56% at 74% 40%, rgba(38, 56, 74, 0.4) 0%, rgba(20, 30, 40, 0) 60%),
          linear-gradient(180deg, #15151c 0%, #101015 50%, #0a0a0e 100%);
      }
      /* Center vignette — cinematic falloff toward the edges of the scene band. */
      .ds-vignette {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(108% 70% at 50% 50%, rgba(0, 0, 0, 0) 46%, rgba(0, 0, 0, 0.5) 100%);
      }
      /* Faint film grain — a fine repeating speckle. Kept subtle. The shimmer
         clip nudges its position so it feels like moving emulsion, not a frozen
         texture. Stretched larger than the frame so the drift reveals no edge. */
      .ds-grain {
        position: absolute;
        top: -40px;
        left: -40px;
        width: calc(100% + 80px);
        height: calc(100% + 80px);
        z-index: 2;
        opacity: 0.5;
        mix-blend-mode: overlay;
        background-image:
          repeating-radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 1px, rgba(0, 0, 0, 0) 1px, rgba(0, 0, 0, 0) 3px),
          repeating-radial-gradient(circle at 70% 65%, rgba(255, 255, 255, 0.04) 0px, rgba(255, 255, 255, 0.04) 1px, rgba(0, 0, 0, 0) 1px, rgba(0, 0, 0, 0) 4px);
        will-change: transform;
        animation-name: vob-grain-shimmer;
        animation-duration: 5s;
        animation-timing-function: steps(10, end);
        animation-fill-mode: both;
        animation-play-state: paused;
      }
      /* Letterbox bars — solid black, ~12% of 1080 = 130px each. On top. */
      .ds-bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 130px;
        z-index: 3;
        background: #000000;
      }
      .ds-bar-top {
        top: 0;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      }
      .ds-bar-bottom {
        bottom: 0;
        box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.6);
      }
      .ds-ghost {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        z-index: 4;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 32px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.18);
      }
      @keyframes vob-grain-shimmer {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(8px, -6px);
        }
        50% {
          transform: translate(-6px, 7px);
        }
        75% {
          transform: translate(7px, 5px);
        }
        100% {
          transform: translate(0, 0);
        }
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="ds-backdrop-film-bars"
      data-timeline-locked
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div class="ds-scene"></div>
      <div class="ds-vignette"></div>
      <div id="ds-grain" class="clip ds-grain" data-start="0" data-duration="5" data-track-index="1"></div>
      <div class="ds-bar ds-bar-top"></div>
      <div class="ds-bar ds-bar-bottom"></div>
      <div class="ds-ghost">framed scene · 2.39:1</div>
    </div>

    <script>
      /* Inert timeline stub — the render driver calls duration()/pause()
         unconditionally; a pure-CSS component loads no GSAP. */
      window.__timelines = window.__timelines || {};
      window.__timelines["ds-backdrop-film-bars"] = {
        duration: function () {
          return 5;
        },
        pause: function () {},
      };
    </script>
  </body>
</html>
